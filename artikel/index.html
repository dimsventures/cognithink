<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel — CogniThink</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC1E1E;--orange:#FF4800;--black:#0A0A0A;--dark:#1A1A1A;--white:#FFFFFF;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--black);color:var(--white);overflow-x:hidden;line-height:1.5;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--black);}
::-webkit-scrollbar-thumb{background:var(--red);}

nav{position:fixed;top:0;left:0;width:100%;z-index:100;padding:18px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,10,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(220,30,30,0.15);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;cursor:pointer;text-decoration:none;color:#fff;}
.nav-logo span{color:var(--red);}
.nav-links{display:flex;gap:30px;}
.nav-links a{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.6);text-decoration:none;text-transform:uppercase;transition:color 0.3s;}
.nav-links a:hover,.nav-links a.active{color:var(--red);}
.nav-cta{background:var(--red);color:#fff;border:none;padding:10px 22px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.3s;text-decoration:none;}
.nav-cta:hover{background:var(--orange);}

#neural-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.2;}

.page-header{padding:140px 40px 60px;position:relative;z-index:1;text-align:center;border-bottom:1px solid rgba(255,255,255,0.06);}
.page-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--red);text-transform:uppercase;margin-bottom:12px;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:72px;line-height:1;margin-bottom:16px;}
.page-title span{color:var(--red);}
.page-sub{color:rgba(255,255,255,0.5);font-size:16px;max-width:500px;margin:0 auto;}

/* FILTER + SORT */
.controls{display:flex;gap:12px;justify-content:center;align-items:center;padding:40px 40px 0;position:relative;z-index:1;flex-wrap:wrap;}
.filter-btn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:8px 20px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.3s;}
.filter-btn:hover,.filter-btn.active{border-color:var(--red);color:var(--red);background:rgba(220,30,30,0.06);}
.controls-sep{width:1px;height:24px;background:rgba(255,255,255,0.08);}
.sort-btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.3);cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:6px;}
.sort-btn:hover,.sort-btn.active{border-color:rgba(220,30,30,0.4);color:rgba(220,30,30,0.7);}
.sort-icon{font-size:10px;}

/* GRID */
.artikel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1200px;margin:40px auto 80px;padding:0 40px;position:relative;z-index:1;}

.artikel-card{background:var(--dark);padding:32px;border:1px solid rgba(255,255,255,0.06);position:relative;overflow:hidden;transition:all 0.3s;text-decoration:none;color:inherit;display:flex;flex-direction:column;}
.artikel-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:var(--red);transition:height 0.4s;}
.artikel-card:hover{border-color:rgba(220,30,30,0.3);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.4);}
.artikel-card:hover::before{height:100%;}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.card-icon{font-size:28px;line-height:1;}

/* URGENSI STARS */
.urgensi{display:flex;gap:3px;align-items:center;}
.star{font-size:11px;line-height:1;color:rgba(255,255,255,0.1);}
.star.lit{color:var(--red);}
.urgensi-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.urgensi-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.2);}

/* URGENSI LEVEL COLOR */
.card-urgensi-1 .star.lit{color:rgba(255,255,255,0.3);}
.card-urgensi-2 .star.lit{color:rgba(100,180,255,0.7);}
.card-urgensi-3 .star.lit{color:rgba(255,180,0,0.8);}
.card-urgensi-4 .star.lit{color:var(--orange);}
.card-urgensi-5 .star.lit{color:var(--red);}

.card-badge{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(220,30,30,0.4);color:var(--red);margin-bottom:12px;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1.1;margin-bottom:10px;letter-spacing:0.5px;flex:1;}
.card-desc{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.6;margin-bottom:20px;}
.card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.card-read{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.25);}
.card-arrow{color:var(--red);font-size:16px;transition:transform 0.3s;}
.artikel-card:hover .card-arrow{transform:translateX(4px);}

/* URGENSI TOOLTIP */
.artikel-card .urgensi-wrap{position:relative;}
.urgensi-tooltip{position:absolute;top:calc(100% + 6px);right:0;background:rgba(10,10,10,0.95);border:1px solid rgba(220,30,30,0.3);padding:6px 10px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.7);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:10;}
.urgensi-wrap:hover .urgensi-tooltip{opacity:1;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:80px 40px;position:relative;z-index:1;color:rgba(255,255,255,0.3);grid-column:1/-1;}
.empty-state p{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;}

footer{border-top:1px solid rgba(255,255,255,0.06);padding:40px;position:relative;z-index:1;}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
.footer-logo span{color:var(--red);}
.footer-links{display:flex;gap:24px;}
.footer-links a{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.35);text-decoration:none;transition:color 0.3s;text-transform:uppercase;}
.footer-links a:hover{color:var(--red);}
.footer-copy{max-width:1200px;margin:20px auto 0;font-family:'Space Mono',monospace;font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:1px;}

@media(max-width:768px){
  nav{padding:16px 20px;}
  .nav-links{display:none;}
  .page-header{padding:100px 20px 40px;}
  .page-title{font-size:48px;}
  .artikel-grid{grid-template-columns:1fr;padding:0 20px;}
  .controls{padding:30px 20px 0;}
  .footer-inner{flex-direction:column;gap:20px;text-align:center;}
  .footer-links{flex-wrap:wrap;justify-content:center;}
}
</style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<nav>
  <a href="../" class="nav-logo">COGNI<span>THINK</span></a>
  <div class="nav-links">
    <a href="../#pillars">Topik</a>
    <a href="./" class="active">Artikel</a>
    <a href="../#resources">Resources</a>
    <a href="../#community">Community</a>
  </div>
  <a href="https://trakteer.id/cognithink" class="nav-cta" target="_blank">Trakteer Artikel</a>
</nav>

<div class="page-header">
  <div class="page-label">Knowledge Base</div>
  <h1 class="page-title">SEMUA <span>ARTIKEL</span></h1>
  <p class="page-sub">Gratis. No fluff. Langsung ke inti — karena waktu lu lebih berharga dari filler.</p>
</div>

<div class="controls">
  <button class="filter-btn active" data-cat="all">Semua</button>
  <button class="filter-btn" data-cat="market">Market</button>
  <button class="filter-btn" data-cat="ai">AI</button>
  <button class="filter-btn" data-cat="psychology">Psikologi</button>
  <div class="controls-sep"></div>
  <button class="sort-btn active" data-sort="newest"><span class="sort-icon">&#8595;</span> Terbaru</button>
  <button class="sort-btn" data-sort="urgensi"><span class="sort-icon">&#9733;</span> Urgensi</button>
</div>

<div class="artikel-grid" id="artikel-grid"></div>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">COGNI<span>THINK</span></div>
    <div class="footer-links">
      <a href="https://instagram.com/cognithink_" target="_blank">Instagram</a>
      <a href="../#community">Community</a>
    </div>
  </div>
  <div class="footer-copy">© 2026 CogniThink. All rights reserved.</div>
</footer>

<script src="data.js"></script>
<script>
// Neural BG
const bgC=document.getElementById('neural-canvas');
const bgX=bgC.getContext('2d');
let W,H,bgNodes=[];
function resize(){W=bgC.width=window.innerWidth;H=bgC.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
class BgNode{constructor(){this.reset();}reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.r=Math.random()*2+1;}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.reset();}draw(){bgX.beginPath();bgX.arc(this.x,this.y,this.r,0,Math.PI*2);bgX.fillStyle=`rgba(220,30,30,${.3+Math.random()*.2})`;bgX.fill();}}
for(let i=0;i<40;i++)bgNodes.push(new BgNode());
function bgLoop(){bgX.clearRect(0,0,W,H);for(let i=0;i<bgNodes.length;i++){for(let j=i+1;j<bgNodes.length;j++){const dx=bgNodes[i].x-bgNodes[j].x,dy=bgNodes[i].y-bgNodes[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<150){bgX.beginPath();bgX.moveTo(bgNodes[i].x,bgNodes[i].y);bgX.lineTo(bgNodes[j].x,bgNodes[j].y);bgX.strokeStyle=`rgba(220,30,30,${(1-d/150)*.15})`;bgX.lineWidth=.5;bgX.stroke();}}}bgNodes.forEach(n=>{n.update();n.draw();});requestAnimationFrame(bgLoop);}
bgLoop();

// Urgensi labels
const URGENSI_LABEL = {
  1: 'Santai — background reading',
  2: 'Useful — worth knowing',
  3: 'Penting — baca minggu ini',
  4: 'Kritikal — baca sekarang',
  5: 'MUST READ'
};

// Build stars HTML
function buildStars(n) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += `<span class="star${i<=n?' lit':''}">&#9733;</span>`;
  return s;
}

// Render card
function renderCard(a) {
  return `
  <a class="artikel-card card-urgensi-${a.urgensi}" href="${a.file}" data-cat="${a.cat}">
    <div class="card-top">
      <span class="card-icon">${a.icon}</span>
      <div class="urgensi-wrap">
        <span class="urgensi-label">Urgensi</span>
        <div class="urgensi">${buildStars(a.urgensi)}</div>
        <div class="urgensi-tooltip">${URGENSI_LABEL[a.urgensi]}</div>
      </div>
    </div>
    <span class="card-badge">${a.badge}</span>
    <div class="card-title">${a.title}</div>
    <div class="card-desc">${a.desc}</div>
    <div class="card-meta">
      <span class="card-read">${a.read}</span>
      <span class="card-arrow">&#8594;</span>
    </div>
  </a>`;
}

// State
let currentCat = 'all';
let currentSort = 'newest';

function renderGrid() {
  const grid = document.getElementById('artikel-grid');
  let data = [...ARTIKEL_DATA];

  // Filter
  if (currentCat !== 'all') data = data.filter(a => a.cat === currentCat);

  // Sort
  if (currentSort === 'urgensi') data.sort((a, b) => b.urgensi - a.urgensi);
  // 'newest' = default order in data.js (index 0 = newest)

  if (data.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>Belum ada artikel di kategori ini.</p></div>';
    return;
  }
  grid.innerHTML = data.map(renderCard).join('');
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    renderGrid();
  });
});

// Sort buttons
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    renderGrid();
  });
});

renderGrid();
</script>

</body>
</html>
